workflows:
  shortcut-signer:
    name: Build & Sign Shortcuts
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      # Loaded purely as an experiment: does the Apple Distribution certificate
      # Codemagic injects have any bearing on `shortcuts sign`? Shortcut signing
      # and app code signing may be unrelated systems, and the build log is what
      # settles it. No provisioning profile, bundle ID or distribution type is
      # declared, because this repo produces .shortcut files, not an .ipa.
      ios_signing:
        certificates:
          - shortcuts_distribution

    # Every push to main builds. Manual runs from the Codemagic UI are
    # unaffected by this section and keep working.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    # Documentation-only pushes should not spend Mac minutes. Codemagic always
    # treats codemagic.yaml itself as part of the changeset, so edits to this
    # file still trigger a build despite the '.' include.
    #
    # Note: the first build after this setting is introduced runs regardless of
    # the condition. Skipping only begins after one successful build.
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - '**/*.md'

    scripts:
      # Reports the OS, the Shortcuts CLI and its documented options, the code
      # signing identities the certificate injection actually delivered, and the
      # iCloud account count. Never fails the build — a missing tool is itself a
      # result, and the next step is what enforces success.
      - name: Diagnose Apple signing environment
        script: |
          chmod +x scripts/diagnose_signing_env.sh
          ./scripts/diagnose_signing_env.sh

      - name: Build and sign shortcuts
        script: |
          chmod +x scripts/build_and_sign.sh
          ./scripts/build_and_sign.sh

    artifacts:
      - build/signed/*.shortcut
      # Published even when signing fails, which is the run that matters most.
      - build/diagnostics/*.txt

workflows:
  shortcut-signer:
    name: Build Shortcuts
    # Linux, not macOS. Generation is pure Python, and signing is impossible on
    # any CI runner: macOS VMs cannot hold an iCloud session, which `shortcuts
    # sign` requires. Building here costs no Mac minutes.
    instance_type: linux_x2
    max_build_duration: 30

    # Every push to main builds. Manual runs from the Codemagic UI are
    # unaffected by this section and keep working.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    # Documentation-only pushes should not spend Mac minutes. Codemagic always
    # treats codemagic.yaml itself as part of the changeset, so edits to this
    # file still trigger a build despite the '.' include.
    #
    # Note: the first build after this setting is introduced runs regardless of
    # the condition. Skipping only begins after one successful build.
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - '**/*.md'

    scripts:
      - name: Build shortcuts
        script: |
          chmod +x scripts/build_and_sign.sh
          ./scripts/build_and_sign.sh

    artifacts:
      - build/unsigned/*.shortcut
      - build/signed/*.shortcut

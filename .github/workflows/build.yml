name: Build & sign shortcuts

on:
  push:
    branches: [main]
    paths:
      # Deliberately excludes signed/ so the commit this workflow makes cannot
      # trigger the workflow again.
      - 'shortcuts/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Least privilege: the only write this needs is committing signed/ back.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate unsigned shortcuts
        run: ./scripts/build_and_sign.sh

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-shortcuts
          path: build/unsigned/*.shortcut

      # Are the signing secrets configured? Mapped to env and tested by length,
      # so the secret value is never interpolated into a command line.
      - name: Check for signing secrets
        id: secrets
        env:
          KEY: ${{ secrets.APPLE_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set — skipping signing. See HANDBOOK.md Part 2."
          fi

      - name: Build shortcut-sign
        if: steps.secrets.outputs.present == 'true'
        env:
          # Pinned so a change upstream can never silently alter what handles the
          # signing key. Bump deliberately after reviewing the diff.
          SHORTCUT_SIGN_REF: a6b422caad939fc86271e31a9d24fce163455489
        run: |
          # Matches shortcut-sign's own CI (clang, libplist-dev, make); libssl-dev
          # and zlib1g-dev cover -lssl/-lcrypto/-lz, which its Makefile links.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang make git libplist-dev libssl-dev zlib1g-dev
          git clone https://github.com/0xilis/shortcut-sign /tmp/shortcut-sign
          git -C /tmp/shortcut-sign checkout --quiet "$SHORTCUT_SIGN_REF"
          git -C /tmp/shortcut-sign submodule update --init --recursive
          make -C /tmp/shortcut-sign
          # The Makefile emits the binary here, not at the repo root.
          BIN=/tmp/shortcut-sign/build/usr/bin/shortcut-sign
          test -x "$BIN" || { echo "ERROR: shortcut-sign not built at $BIN"; exit 1; }
          echo "/tmp/shortcut-sign/build/usr/bin" >> "$GITHUB_PATH"

      - name: Sign shortcuts
        if: steps.secrets.outputs.present == 'true'
        env:
          APPLE_SIGNING_KEY: ${{ secrets.APPLE_SIGNING_KEY }}
          APPLE_AUTH_DATA: ${{ secrets.APPLE_AUTH_DATA }}
        run: ./scripts/ci_sign.sh

      - name: Commit signed shortcuts
        if: steps.secrets.outputs.present == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signed
          if git diff --cached --quiet; then
            echo "No change to signed shortcuts."
          else
            git commit -m "Sign shortcuts [skip ci]"
            # A human push can land while this job builds shortcut-sign, moving
            # main ahead and rejecting a plain push. Rebase onto the latest main
            # (signed/ never conflicts with source or docs) and retry a few times.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main"
              git pull --rebase origin main
            done
            if [ "$pushed" != true ]; then
              echo "ERROR: could not push signed shortcuts after retries" >&2
              exit 1
            fi
          fi
